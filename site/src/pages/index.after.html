<aside class="counter" aria-hidden="true" data-counter>
  <span class="counter__eyelet"></span>
  <span class="counter__no" data-counter-no>00</span>
  <span class="counter__name" data-counter-name>Cover</span>
</aside>

<dialog class="lookbox" data-lookbox aria-labelledby="lookbox-title">
  <button class="lookbox__close" type="button" data-lookbox-close aria-label="Close"><svg><use href="#i-close"/></svg></button>
  <figure class="lookbox__fig" data-lookbox-fig></figure>
  <div class="lookbox__tag">
    <span class="tag__eyelet"></span>
    <p class="code" data-lookbox-code></p>
    <h3 id="lookbox-title" data-lookbox-title></h3>
    <p class="lookbox__note">Quote this code in your enquiry and the team will send you the details.</p>
    <div class="lookbox__actions"><a class="btn" href="#contact" data-lookbox-ask>Ask about this style</a></div>
  </div>
</dialog>

<canvas class="fabric-gl" data-fabric-gl aria-hidden="true"></canvas>
